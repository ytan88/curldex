# google_calendar credentials: copy this file to credentials.yaml (git-ignored), fill it in and
# `chmod 600` it. Values may be literal, ${env:VAR} or ${file:PATH}.
# Setting up Google access, with Claude Code: docs/google_setup.md

# The calendar to use: "primary" with the OAuth login; with a service account, the email address
# of the calendar you shared with it.
calendar_id: "primary"

# Either an OAuth client, then `curldex login google_calendar` once. In the Google Cloud console:
# enable the Google Calendar API; set up the OAuth consent screen, adding yourself as a test user;
# then Credentials > Create credentials > OAuth client ID > Desktop app.
client_id: ""
client_secret: ""

# Or a service account's JSON key file (no login): share your calendar with the account's email
# address ("Make changes to events") and set calendar_id to your address.
service_account_file: ""
service_account_subject: ""
