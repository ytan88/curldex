# Written by `curldex verify`: examples that ran against the service.
# Only the command and the response's shape are kept, no data.
acl-delete:
  date: '2026-10-11'
  status: 204
  command: curl -q -sS -g -X DELETE -K "$(curldex auth google_calendar)" 'https://www.googleapis.com/calendar/v3/calendars/<calendarId>/acl/<ruleId>'
  shape: 'null'
acl-get:
  date: '2026-10-11'
  status: 200
  command: curl -q -sS -g -K "$(curldex auth google_calendar)" 'https://www.googleapis.com/calendar/v3/calendars/<calendar_id>/acl/<ruleId>'
  shape: '{kind: string, etag: string, id: string, scope: {type: string, value: string}, role: string}'
acl-insert:
  date: '2026-10-11'
  status: 200
  command: 'curl -q -sS -g -K "$(curldex auth google_calendar)" --json ''{"role": "reader", "scope": {"type": "user",
    "value": "sam@example.com"}}'' ''https://www.googleapis.com/calendar/v3/calendars/<calendar_id>/acl?sendNotifications=false'''
  shape: '{kind: string, etag: string, id: string, scope: {type: string, value: string}, role: string}'
acl-list:
  date: '2026-10-11'
  status: 200
  command: curl -q -sS -g -K "$(curldex auth google_calendar)" 'https://www.googleapis.com/calendar/v3/calendars/<calendar_id>/acl'
  shape: '{kind: string, etag: string, nextSyncToken: string, items[]: {kind: string, etag: string, id: string,
    scope: {type: string, value: string}, role: string}}'
acl-patch:
  date: '2026-10-11'
  status: 200
  command: 'curl -q -sS -g -X PATCH -K "$(curldex auth google_calendar)" --json ''{"role": "writer"}'' ''https://www.googleapis.com/calendar/v3/calendars/<calendar_id>/acl/<rule_id>'''
  shape: '{kind: string, etag: string, id: string, scope: {type: string, value: string}, role: string}'
acl-update:
